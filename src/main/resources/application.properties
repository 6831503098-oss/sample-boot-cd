server.port=8080

# H2: an in-memory database — perfect for class; data disappears on restart
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

# run data.sql AFTER Hibernate creates the tables (required since Boot 2.5)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# browse the database at http://localhost:8081/h2-console (JDBC URL: jdbc:h2:mem:testdb)
spring.h2.console.enabled=true
